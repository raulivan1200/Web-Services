name: CI

on:
  push:
    branches: [main, parcial01]
  pull_request:
    branches: [main, parcial01]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EventsHub.slnx

      - name: Build
        run: dotnet build EventsHub.slnx --configuration Release --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  integration:
    name: Bruno integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build API
        run: dotnet build EventsHub.slnx --configuration Release

      - name: Run Bruno collection
        shell: bash
        run: |
          dotnet run \
            --project src/EventsHub.Api/EventsHub.Api.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            --urls http://127.0.0.1:5080 \
            > /tmp/eventshub-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/api/v1/events > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              cat /tmp/eventshub-api.log
              exit 1
            fi

            sleep 1
          done

          cd tests/EventsHub.IntegrationTests
          npx --yes @usebruno/cli@4.1.0 run . \
            -r \
            --env local \
            --env-var baseUrl=http://127.0.0.1:5080/api/v1 \
            --bail
