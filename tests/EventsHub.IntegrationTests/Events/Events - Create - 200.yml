info:
  name: Events - Create - 200
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "id": "{{$guid}}",
        "title": "Created by Bruno integration test",
        "date": "2030-10-24T18:00:00Z",
        "description": "Initial event content for the Bruno CRUD sequence",
        "category": "integration-test",
        "isCancelled": false,
        "city": "Initial test city",
        "venue": "Initial test venue",
        "latitude": "21.0997",
        "longitude": "-86.7561"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response returns the created event ID", function() {
          const id = res.getBody();
          expect(id).to.be.a("string").and.not.to.be.empty;
          bru.setVar("createdEventId", id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
