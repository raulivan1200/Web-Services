info:
  name: Events - Create - 200
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "id": "{{$guid}}",
        "title": "{{$randomCatchPhrase}}",
        "date": "{{$randomDateFuture}}",
        "description": "{{$randomLoremParagraph}}",
        "category": "music",
        "isCancelled": false,
        "city": "{{$randomCity}}",
        "venue": "{{$randomStreetName}}",
        "latitude": "21.0997",
        "longitude": "-86.7561"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response returns the created event ID", function() {
          const id = res.getBody();
          expect(id).to.be.a("string").and.not.to.be.empty;
          bru.setVar("createdEventId", id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
