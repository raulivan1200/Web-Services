info:
  name: Events - Get - 200
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/events/:eventId"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response returns the requested event", function() {
          const body = res.getBody();
          expect(body.id).to.equal(bru.getVar("eventId"));
          expect(body.title).to.be.a("string").and.not.to.be.empty;
          expect(body.date).to.be.a("string");
          expect(body.isCancelled).to.be.a("boolean");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
