info:
  name: Events - Edit - 204
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "id": "{{createdEventId}}",
        "title": "Updated by Bruno integration test",
        "date": "2031-10-24T18:00:00Z",
        "description": "Updated event content for the Bruno CRUD sequence",
        "category": "edited-integration-test",
        "isCancelled": true,
        "city": "Updated test city",
        "venue": "Updated test venue",
        "latitude": "21.0997",
        "longitude": "-86.7561"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 204 No Content", function() {
          expect(res.getStatus()).to.equal(204);
        });

        test("Response has no content", function() {
          expect(res.getBody()).to.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
