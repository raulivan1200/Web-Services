info:
  name: Events - Delete - 200
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/events/:eventId"
  params:
    - name: eventId
      value: "{{createdEventId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response has no content", function() {
          expect(res.getBody()).to.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
