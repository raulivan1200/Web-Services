info:
  name: Events - Get - Bad Id - 404
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/events/:eventId"
  params:
    - name: eventId
      value: invalid-malformed-id-!@#$
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 404 Not Found", function() {
          expect(res.getStatus()).to.equal(404);
        });

        test("Response explains that the event does not exist", function() {
          const body = res.getBody();
          expect(body).to.be.a("string");
          expect(body).to.equal("The event was not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
