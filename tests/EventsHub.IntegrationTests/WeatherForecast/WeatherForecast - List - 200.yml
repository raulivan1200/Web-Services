info:
  name: WeatherForecast - List - 200
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/weatherforecast"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response returns an array", function() {
          const body = res.getBody();
          expect(body).to.be.an("array");
          expect(body.length).to.equal(5);
        });

        test("Every forecast matches the expected contract", function() {
          res.getBody().forEach(function(forecast) {
            expect(Date.parse(forecast.date)).not.to.be.NaN;
            expect(forecast.temperatureC).to.be.a("number");
            expect(forecast.temperatureF).to.be.a("number");
            expect(forecast.summary).to.be.a("string");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
